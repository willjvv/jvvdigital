name: Deploy JVV Digital to GitHub Pages

on:
  # Triggers the workflow on push to main branch
  push:
    branches: [ main ]
  
  # Allows you to manually trigger from GitHub UI
  workflow_dispatch:
  
  # Optional: Also deploy when you edit through GitHub's web interface
  pull_request:
    branches: [ main ]

# Sets permissions for the deployment
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment
concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # Fetch all history for proper build
          fetch-depth: 0
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'  # Use Node 20 for best Astro compatibility
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci  # Uses exact versions from package-lock.json
      
      - name: Build the website
        run: npm run build
        env:
          # Build for production
          PUBLIC_URL: https://jvvdigital.com
      
      - name: Setup Pages
        uses: actions/configure-pages@v3
      
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist  # Astro's default build output

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4